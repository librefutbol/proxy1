<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>GameUnion Proxy</title>\n    <style>\n        body {\n            font-family: Arial, sans-serif;\n            background-color: #121212;\n            color: #ffffff;\n            margin: 0;\n            padding: 20px;\n        }\n        #container {\n            max-width: 600px;\n            margin: auto;\n            padding: 20px;\n            border-radius: 8px;\n            background-color: #1e1e1e;\n        }\n        h1 {\n            text-align: center;\n        }\n        input[type=\"text\"] {\n            width: 100%;\n            padding: 10px;\n            margin: 10px 0;\n            border: none;\n            border-radius: 4px;\n            background-color: #333;\n            color: #fff;\n        }\n        button {\n            background-color: #6200ea;\n            color: white;\n            padding: 10px;\n            border: none;\n            border-radius: 4px;\n            cursor: pointer;\n            width: 100%;\n        }\n        button:hover {\n            background-color: #3700b3;\n        }\n        .results {\n            margin-top: 20px;\n        }\n    </style>\n</head>\n<body>\n    <div id=\"container\">\n        <h1>GameUnion Proxy</h1>\n        <input type=\"text\" id=\"urlInput\" placeholder=\"Enter URL here...\">\n        <label><input type=\"checkbox\" id=\"bypassOption\"> Bypass options</label>\n        <button id=\"submitButton\">Submit</button>\n        <div class=\"results\" id=\"resultsDisplay\"></div>\n    </div>\n    <script>\n        document.getElementById('submitButton').addEventListener('click', function() {\n            const url = document.getElementById('urlInput').value;\n            const bypass = document.getElementById('bypassOption').checked;\n            const resultsDisplay = document.getElementById('resultsDisplay');\n            // Here you would typically call your proxy service and handle the response\n            resultsDisplay.innerHTML = 'URL: ' + url + '<br>Bypass: ' + (bypass ? 'Enabled' : 'Disabled');\n        });\n    </script>\n</body>\n</html>
